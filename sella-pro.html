<style>/* SELLA — el sello de cada cita.
   Concepto: tarjetas tipo boleto (citas), sellos de lacre (confirmaciones) y una línea de tiempo viva.
   Móvil primero; barra inferior en teléfono, barra lateral en escritorio. */
:root{
  --paper:#EEF0EB; --surface:#FFFFFF; --surface-2:#E4E7E1; --ink:#121614; --ink-2:#3B423E; --muted:#68716C; --line:#D5DAD3;
  --green:#0E5E4A; --green-2:#127A5F; --green-ink:#F1FFF8; --green-soft:#D7EFE6;
  --wax:#B83227; --wax-soft:#F7DEDA; --corn:#E2A73B; --corn-soft:#FBEFD5; --sky:#2F5FD0; --sky-soft:#DFE7FA;
  --good:#167049; --warn:#8A5A00; --bad:#B42318;
  --shadow:0 1px 2px rgba(18,22,20,.06),0 8px 24px rgba(18,22,20,.07);
  --display:"Unbounded","Arial Black",system-ui,sans-serif; --body:"Onest","Segoe UI",system-ui,-apple-system,sans-serif; --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --r:18px; --r-sm:12px; --ease:cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0B0E0D; --surface:#141917; --surface-2:#1C2320; --ink:#EAF0EC; --ink-2:#C3CCC7; --muted:#8E9993; --line:#26302C;
  --green:#3CCB9C; --green-2:#5ADDB1; --green-ink:#04130D; --green-soft:#10302A;
  --wax:#FF7A6B; --wax-soft:#3A1915; --corn:#F2BF5E; --corn-soft:#3A2C12; --sky:#86A7FF; --sky-soft:#1A2547;
  --good:#5BD49A; --warn:#F2BF5E; --bad:#FF7A6B; --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0B0E0D; --surface:#141917; --surface-2:#1C2320; --ink:#EAF0EC; --ink-2:#C3CCC7; --muted:#8E9993; --line:#26302C;
  --green:#3CCB9C; --green-2:#5ADDB1; --green-ink:#04130D; --green-soft:#10302A;
  --wax:#FF7A6B; --wax-soft:#3A1915; --corn:#F2BF5E; --corn-soft:#3A2C12; --sky:#86A7FF; --sky-soft:#1A2547;
  --good:#5BD49A; --warn:#F2BF5E; --bad:#FF7A6B; --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35); color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 var(--body);-webkit-font-smoothing:antialiased;min-height:100dvh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:var(--green)}
:focus-visible{outline:2px solid var(--green-2);outline-offset:2px;border-radius:6px}
img{max-width:100%}
[hidden]{display:none!important}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font:700 clamp(1.7rem,4.6vw,2.6rem)/1.05 var(--display);letter-spacing:-.02em}
h2{font:600 1.15rem/1.2 var(--display);letter-spacing:-.01em}
h3{font-size:1rem;font-weight:700}
p{margin:0}
.mono,.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:.86rem} .tiny{font-size:.76rem}
.eyebrow{font:600 .7rem/1 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.wrap{padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap} .grow{flex:1;min-width:0}
.stack{display:grid;gap:10px} .stack-lg{display:grid;gap:18px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media(max-width:420px){.grid2.collapse{grid-template-columns:1fr}}

/* Botones */
.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:9px 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;transition:transform .15s var(--ease),background .15s,box-shadow .15s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--green);border-color:var(--green);color:var(--green-ink);box-shadow:0 6px 16px -6px var(--green)}
.btn.primary:hover{background:var(--green-2)}
.btn.wax{background:var(--wax);border-color:var(--wax);color:#fff}
.btn.ghost{background:transparent;border-color:transparent;color:var(--green)}
.btn.danger{color:var(--bad)}
.btn.sm{min-height:34px;padding:6px 12px;font-size:.85rem}
.btn.lg{min-height:52px;padding:12px 22px;font-size:1.02rem}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.iconbtn{width:38px;height:38px;border-radius:12px;border:0;background:transparent;display:grid;place-items:center;color:var(--ink-2)}
.iconbtn:hover{background:var(--surface-2)}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Campos */
label.f{display:grid;gap:6px;font-size:.85rem;font-weight:600;color:var(--ink-2)}
.in{width:100%;min-height:46px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:10px 13px;font-size:16px;transition:border-color .15s,box-shadow .15s}
.in:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 4px var(--green-soft)}
textarea.in{min-height:84px;resize:vertical}
.switch{appearance:none;width:48px;height:28px;border-radius:14px;background:var(--line);position:relative;border:0;flex:none;cursor:pointer;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s var(--ease)}
.switch:checked{background:var(--green)} .switch:checked::after{transform:translateX(20px)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:14px}
.seg{display:inline-flex;background:var(--surface-2);border-radius:999px;padding:4px;gap:2px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg button{border:0;background:transparent;border-radius:999px;padding:7px 14px;font-weight:600;font-size:.86rem;color:var(--muted);white-space:nowrap;transition:background .2s,color .2s}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.1)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.choice{border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px;text-align:left;font-weight:600;transition:border-color .15s,background .15s,transform .15s}
.choice:active{transform:scale(.98)}
.choice[aria-pressed="true"]{border-color:var(--green);background:var(--green-soft)}
.choice small{display:block;font-weight:400;color:var(--muted);margin-top:2px}

/* Tarjetas */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card.flat{box-shadow:none}
.card.lift{box-shadow:var(--shadow);border-color:transparent}
.badge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:.74rem;font-weight:700;white-space:nowrap}
.badge.pending{background:var(--corn-soft);color:var(--warn)} .badge.confirmed{background:var(--green-soft);color:var(--green)}
.badge.done{background:var(--sky-soft);color:var(--sky)} .badge.no_show,.badge.cancelled{background:var(--wax-soft);color:var(--bad)}
.badge.neutral{background:var(--surface-2);color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.empty{display:grid;justify-items:center;text-align:center;gap:10px;padding:28px 14px;color:var(--muted)}
.empty svg{width:56px;height:56px;color:var(--line)}

/* Boleto de cita */
.ticket{position:relative;display:grid;grid-template-columns:86px 1fr;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;transition:transform .2s var(--ease),box-shadow .2s}
.ticket:hover{box-shadow:var(--shadow)}
.ticket .stub{padding:12px 10px;border-right:2px dashed var(--line);display:grid;align-content:center;gap:2px;text-align:center;background:linear-gradient(var(--surface-2),var(--surface-2)) padding-box}
.ticket .stub b{font:700 1.05rem/1 var(--mono)} .ticket .stub span{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.ticket::before,.ticket::after{content:"";position:absolute;left:79px;width:14px;height:14px;border-radius:50%;background:var(--paper);border:1px solid var(--line)}
.ticket::before{top:-8px} .ticket::after{bottom:-8px}
.ticket .main{padding:12px 14px;display:grid;gap:6px;min-width:0}
.ticket .who{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ticket .acts{display:flex;gap:6px;flex-wrap:wrap}
.ticket.is-cancelled{opacity:.55}

/* Sello de lacre */
.seal{position:fixed;left:50%;top:42%;z-index:90;width:150px;height:150px;margin:-75px 0 0 -75px;pointer-events:none;animation:stamp .9s var(--ease) forwards}
.seal .disc{width:100%;height:100%;border-radius:50%;background:radial-gradient(circle at 35% 30%,#e0574b,var(--wax) 55%,#7c1c15);box-shadow:inset 0 0 0 6px rgba(255,255,255,.12),inset 0 -8px 18px rgba(0,0,0,.35),0 12px 30px rgba(120,20,10,.35);display:grid;place-items:center;color:#fff;text-align:center;font:700 .95rem/1.1 var(--display);letter-spacing:.06em;text-transform:uppercase}
.seal .disc span{display:block;font:500 .66rem var(--body);letter-spacing:.2em;opacity:.85}
@keyframes stamp{0%{transform:scale(2.4) rotate(-18deg);opacity:0}35%{transform:scale(.92) rotate(-8deg);opacity:1}48%{transform:scale(1.04) rotate(-9deg)}70%{transform:scale(1) rotate(-9deg);opacity:1}100%{transform:scale(1) rotate(-9deg);opacity:0}}

/* Shell de la app */
.shell{min-height:100dvh}
.topbar{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding-top:max(10px,env(safe-area-inset-top));padding-bottom:10px;display:flex;align-items:center;gap:12px}
.logo{display:flex;align-items:center;gap:9px;font:700 1.05rem var(--display);letter-spacing:-.02em;text-decoration:none;color:var(--ink)}
.logo i{width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#e0574b,var(--wax) 60%,#7c1c15);display:grid;place-items:center;color:#fff;font:700 .8rem var(--display);font-style:normal;box-shadow:inset 0 -3px 6px rgba(0,0,0,.25)}
.bizpick{margin-left:auto;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 8px 6px 12px;max-width:62%;min-width:0}
.bizpick b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.92rem}
.main{padding-bottom:calc(100px + env(safe-area-inset-bottom));max-width:980px;margin:0 auto}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;display:grid;grid-template-columns:repeat(5,1fr);background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right)) calc(6px + env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left))}
.tabs a{display:grid;justify-items:center;gap:2px;padding:6px 0;font-size:.7rem;font-weight:600;color:var(--muted);text-decoration:none;border-radius:12px;position:relative;transition:color .2s}
.tabs a svg{width:23px;height:23px}
.tabs a[aria-current="page"]{color:var(--green)}
.tabs a[aria-current="page"]::before{content:"";position:absolute;top:-7px;width:28px;height:3px;border-radius:2px;background:var(--green)}
.tabs .count{position:absolute;top:2px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--wax);color:#fff;font-size:.66rem;display:grid;place-items:center}
@media(min-width:960px){
  .tabs{top:0;right:auto;width:220px;grid-template-columns:1fr;grid-auto-rows:min-content;gap:4px;border-top:0;border-right:1px solid var(--line);padding:calc(84px + env(safe-area-inset-top)) 12px 20px}
  .tabs a{grid-template-columns:26px 1fr;justify-items:start;align-items:center;gap:12px;padding:11px 14px;font-size:.95rem}
  .tabs a[aria-current="page"]{background:var(--green-soft)} .tabs a[aria-current="page"]::before{display:none}
  .tabs .count{position:static;margin-left:auto}
  .shell .topbar,.shell .main{margin-left:220px}
  .main{padding-bottom:48px}
}
.view{display:grid;gap:16px;animation:rise .35s var(--ease);min-width:0}
.view>*{min-width:0}
.main{min-width:0}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.vhead{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;padding-top:6px}
.vhead h1{flex:1;min-width:200px}

/* Hoy */
.hero-card{border-radius:24px;padding:20px;background:var(--green);color:var(--green-ink);position:relative;overflow:hidden;display:grid;gap:12px}
.hero-card::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;border:2px dashed color-mix(in srgb,var(--green-ink) 30%,transparent)}
.hero-card .eyebrow{color:color-mix(in srgb,var(--green-ink) 70%,transparent)}
.hero-card .big{font:700 clamp(1.4rem,5vw,2rem)/1.1 var(--display)}
.hero-card .count{font:600 .9rem var(--mono);background:color-mix(in srgb,var(--green-ink) 14%,transparent);border-radius:999px;padding:5px 12px;justify-self:start}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media(max-width:640px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:4px}
.stat b{font:700 1.5rem/1 var(--display)} .stat span{font-size:.8rem;color:var(--muted)}
.stat.attn{background:var(--corn-soft);border-color:transparent}
.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:110px;padding-top:8px}
.bars div{display:grid;gap:6px;justify-items:center;height:100%;align-content:end}
.bars i{display:block;width:100%;max-width:34px;border-radius:8px 8px 4px 4px;background:var(--green-soft);transition:height .6s var(--ease)}
.bars i.today{background:var(--green)}
.bars small{font-size:.7rem;color:var(--muted)}

/* Agenda: línea de tiempo */
.days{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none;scroll-snap-type:x proximity}
.days::-webkit-scrollbar{display:none}
.day{flex:none;width:58px;scroll-snap-align:start;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:8px 0;display:grid;justify-items:center;gap:1px;transition:background .2s,transform .15s}
.day small{font-size:.66rem;font-weight:700;color:var(--muted);text-transform:uppercase}
.day b{font:700 1.15rem var(--display)}
.day i{width:5px;height:5px;border-radius:50%;background:transparent}
.day i.has{background:var(--green)}
.day[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.day[aria-pressed="true"] small{color:inherit;opacity:.7}
.day.closed b{opacity:.4}
.timeline{position:relative;display:grid;grid-template-columns:52px 1fr;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.tl-hours{position:relative;border-right:1px solid var(--line)}
.tl-hours span{position:absolute;right:8px;transform:translateY(-50%);font:500 .68rem var(--mono);color:var(--muted)}
.tl-cols{position:relative;display:grid;overflow-x:auto}
.tl-col{position:relative;min-width:150px;border-left:1px solid var(--line)}
.tl-col:first-child{border-left:0}
.tl-colhead{position:sticky;top:0;z-index:3;height:34px;display:flex;align-items:center;gap:6px;padding:0 10px;font-size:.8rem;font-weight:700;background:var(--surface);border-bottom:1px solid var(--line)}
.tl-grid{position:relative}
.tl-line{position:absolute;left:0;right:0;border-top:1px solid var(--line)}
.tl-line.half{border-top-style:dashed;opacity:.6}
.tl-closed{position:absolute;left:0;right:0;background:repeating-linear-gradient(-45deg,transparent 0 6px,color-mix(in srgb,var(--line) 70%,transparent) 6px 7px)}
.tl-now{position:absolute;left:0;right:0;border-top:2px solid var(--wax);z-index:4}
.tl-now::before{content:"";position:absolute;left:-5px;top:-6px;width:10px;height:10px;border-radius:50%;background:var(--wax)}
.tl-slot{position:absolute;left:4px;right:4px;border-radius:10px;border:1.5px dashed transparent;transition:border-color .15s,background .15s}
.tl-slot:hover{border-color:var(--green);background:var(--green-soft)}
.tl-block{position:absolute;left:6px;right:6px;border-radius:12px;padding:6px 9px;font-size:.78rem;line-height:1.25;overflow:hidden;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;box-shadow:0 1px 0 rgba(0,0,0,.04);border-left:4px solid var(--c,var(--green));background:color-mix(in srgb,var(--c,var(--green)) 14%,var(--surface));transition:box-shadow .15s,transform .15s}
.tl-block b{display:block;font-size:.82rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-block.pending{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--corn) 16%,var(--surface)) 0 8px,color-mix(in srgb,var(--corn) 24%,var(--surface)) 8px 16px);border-left-color:var(--corn)}
.tl-block.dragging{cursor:grabbing;box-shadow:0 12px 28px rgba(0,0,0,.25);transform:scale(1.02);z-index:10;opacity:.95}
.tl-block.done,.tl-block.no_show{opacity:.55}
.ghost-time{position:absolute;right:8px;top:6px;font:600 .72rem var(--mono);background:var(--ink);color:var(--paper);border-radius:6px;padding:2px 6px}

/* Chats */
.chat-layout{display:grid;gap:14px;min-width:0}
.chat-layout>*{min-width:0}
@media(max-width:899px){.chat-layout.has-thread .convcard{display:none}}
@media(min-width:900px){.phone .backbtn{display:none}}
@media(min-width:900px){.chat-layout{grid-template-columns:320px 1fr;align-items:start}}
.convlist{display:grid}
.conv{display:flex;gap:12px;align-items:center;padding:12px;border-radius:14px;text-decoration:none;color:inherit;border:0;background:none;text-align:left;width:100%}
.conv:hover,.conv[aria-current="true"]{background:var(--surface-2)}
.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:var(--green-soft);color:var(--green);flex:none}
.conv .meta{display:grid;justify-items:end;gap:4px}
.phone{background:var(--surface);border:1px solid var(--line);border-radius:22px;display:grid;grid-template-rows:auto 1fr auto;height:min(72dvh,700px);min-height:440px;overflow:hidden}
.phone-head{display:flex;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}
.thread{overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:6px;background:radial-gradient(circle at 20% 10%,color-mix(in srgb,var(--green-soft) 50%,transparent),transparent 40%),var(--paper)}
.bub{max-width:84%;padding:8px 12px;border-radius:16px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:.93rem;animation:pop .25s var(--ease);box-shadow:0 1px 1px rgba(0,0,0,.04)}
@keyframes pop{from{opacity:0;transform:translateY(6px) scale(.98)}to{opacity:1;transform:none}}
.bub.customer{align-self:flex-start;background:var(--surface);border-top-left-radius:5px}
.bub.bot{align-self:flex-end;background:var(--green-soft);border-top-right-radius:5px}
.bub.owner{align-self:flex-end;background:var(--sky-soft);border-top-right-radius:5px}
.bub .m{display:flex;gap:6px;justify-content:flex-end;font-size:.66rem;color:var(--muted);margin-top:3px}
.typing{align-self:flex-end;background:var(--green-soft);border-radius:16px;padding:10px 14px;display:flex;gap:4px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--green);animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}
.composer{border-top:1px solid var(--line);padding:10px;display:grid;gap:8px;background:var(--surface)}
.composer form{display:flex;gap:8px}
.composer .in{border-radius:999px}
.quick{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.quick button{flex:none;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:5px 11px;font-size:.8rem}
.sysline{align-self:center;font-size:.74rem;background:var(--surface);color:var(--muted);border-radius:999px;padding:4px 12px}

/* Ventas: tablero de pedidos */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(240px,1fr);gap:12px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x proximity}
.lane{background:var(--surface-2);border-radius:var(--r);padding:10px;display:grid;gap:8px;align-content:start;scroll-snap-align:start;min-height:160px}
.lane h3{display:flex;align-items:center;gap:8px;font-size:.85rem;padding:2px 4px}
.order{background:var(--surface);border-radius:14px;padding:12px;display:grid;gap:6px;border:1px solid var(--line)}
.list{display:grid}
.item{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}

/* Hojas y avisos */
.sheet-back{position:fixed;inset:0;z-index:70;background:rgba(6,10,8,.48);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{width:100%;max-width:560px;max-height:92dvh;overflow:auto;background:var(--paper);border-radius:24px 24px 0 0;padding:10px max(18px,env(safe-area-inset-right)) calc(22px + env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left));display:grid;gap:14px;animation:up .3s var(--ease)}
.sheet::before{content:"";justify-self:center;width:42px;height:5px;border-radius:3px;background:var(--line)}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@media(min-width:700px){.sheet-back{align-items:center}.sheet{border-radius:24px}.sheet::before{display:none}}
.sheet-head{display:flex;align-items:center;gap:10px}.sheet-head h2{flex:1}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom));z-index:95;background:var(--ink);color:var(--paper);padding:11px 18px;border-radius:999px;font-weight:600;font-size:.9rem;max-width:calc(100% - 32px);box-shadow:var(--shadow);animation:up .25s var(--ease)}
@media(min-width:960px){.toast{bottom:28px}}
.slots{display:flex;flex-wrap:wrap;gap:8px}
.slot{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 12px;font:500 .88rem var(--mono);transition:all .15s}
.slot[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:var(--green-ink)}
.banner{border-radius:var(--r);padding:14px 16px;display:flex;gap:14px;align-items:center}
.banner.attn{background:var(--corn-soft)} .banner.ok{background:var(--green-soft)}
.pulse{width:10px;height:10px;border-radius:50%;background:var(--corn);flex:none;box-shadow:0 0 0 0 var(--corn);animation:pulse 2s infinite}
.pulse.ok{background:var(--good);box-shadow:0 0 0 0 var(--good)}
@keyframes pulse{70%{box-shadow:0 0 0 10px transparent}100%{box-shadow:0 0 0 0 transparent}}
.steps{display:flex;gap:6px}.steps i{flex:1;height:5px;border-radius:3px;background:var(--line);transition:background .3s}.steps i.on{background:var(--green)}
.skeleton{background:linear-gradient(90deg,var(--surface-2),var(--surface),var(--surface-2));background-size:200% 100%;animation:shine 1.2s infinite;border-radius:12px}
@keyframes shine{to{background-position:-200% 0}}

/* Landing */
.land{overflow-x:hidden}
.land-nav{display:flex;align-items:center;gap:14px;padding-top:max(14px,env(safe-area-inset-top));padding-bottom:14px;max-width:1120px;margin:0 auto}
.land-hero{max-width:1120px;margin:0 auto;display:grid;gap:34px;padding-top:28px;padding-bottom:40px;align-items:center}
@media(min-width:900px){.land-hero{grid-template-columns:1.1fr .9fr;padding-top:56px}}
.land-hero h1{font-size:clamp(2.2rem,7vw,4.1rem);line-height:.98}
.land-hero h1 em{font-style:normal;color:var(--wax);position:relative;white-space:nowrap}
.land-hero .lead{font-size:1.12rem;color:var(--ink-2);max-width:34em}
.demo-phone{justify-self:center;width:min(340px,100%);border-radius:38px;padding:12px;background:#121614;outline:1px solid var(--line);box-shadow:0 30px 60px -20px rgba(0,0,0,.4);transform:rotate(2deg)}
.demo-phone .screen{border-radius:28px;overflow:hidden;background:var(--paper);height:540px;display:grid;grid-template-rows:auto 1fr}
.demo-phone .screen .phone-head{background:var(--green);color:var(--green-ink);border:0}
.demo-phone .thread{padding:12px}
.feat{max-width:1120px;margin:0 auto;padding-top:30px;padding-bottom:30px;display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.feat .card{display:grid;gap:8px}
.feat .ico{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--green-soft);color:var(--green)}
.how{max-width:1120px;margin:0 auto;padding-top:20px;padding-bottom:40px;display:grid;gap:18px}
.how ol{list-style:none;padding:0;margin:0;display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));counter-reset:s}
.how li{counter-increment:s;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:6px}
.how li::before{content:counter(s);font:700 1.6rem var(--display);color:var(--wax)}
.cta-band{max-width:1120px;margin:0 auto 40px;border-radius:28px;background:var(--ink);color:var(--paper);padding:34px 24px;display:grid;gap:14px;justify-items:start}
.foot{max-width:1120px;margin:0 auto;padding-bottom:max(30px,env(safe-area-inset-bottom));display:flex;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:.85rem}

/* Auth y onboarding */
.center{min-height:100dvh;display:grid;align-content:center;justify-items:center;padding-top:max(24px,env(safe-area-inset-top));padding-bottom:max(24px,env(safe-area-inset-bottom))}
.auth{width:min(440px,100%);display:grid;gap:16px}
.onb{width:min(980px,100%);display:grid;gap:22px;align-items:start}
@media(min-width:900px){.onb{grid-template-columns:1fr 340px}}
.onb .preview{position:sticky;top:20px}
.onb .preview .demo-phone{transform:none}
.onb .preview .screen{height:520px}

/* Reserva pública */
.pub{width:min(620px,100%);margin:0 auto;display:grid;gap:16px;padding-top:max(20px,env(safe-area-inset-top));padding-bottom:max(30px,env(safe-area-inset-bottom))}
.pub-head{display:grid;gap:6px;padding:22px;border-radius:24px;background:var(--ink);color:var(--paper)}
.svcopt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:14px;border-radius:16px;border:1.5px solid var(--line);background:var(--surface);transition:border-color .15s,background .15s}
.svcopt[aria-pressed="true"]{border-color:var(--green);background:var(--green-soft)}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.row>span.in{min-width:0;flex:1 1 0}
.stack>*,.stack-lg>*{min-width:0}
</style>
